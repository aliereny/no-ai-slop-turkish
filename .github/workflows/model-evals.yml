name: Model eval baseline

on:
  workflow_dispatch:
    inputs:
      model:
        description: Pin the OpenAI model ID for all 152 cases
        required: true
        type: string

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Corpus'u doğrula
        run: python scripts/eval_runner.py validate
      - name: Gerçek skill çıktılarını kaydet
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY repository secret is required'; exit 1; }
          python scripts/eval_runner.py run --provider api --model "$MODEL" --output eval-results/outputs.jsonl
      - name: Ön değerlendirmeyi kaydet
        run: python scripts/eval_runner.py grade --output eval-results/outputs.jsonl --report eval-results/report.json > /dev/null
      - name: Sonuçları inceleme için yükle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: model-evals-${{ github.run_id }}
          path: eval-results/
          if-no-files-found: ignore
