name: Türkçe plugin package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Upstream config'ini ağ kullanmadan doğrula
        run: python scripts/check_upstream.py --validate-config
      - name: Upstream denetleyicisini ağsız test et
        run: python scripts/check_upstream.py --self-test
      - name: Türkçe yüzey denetleyicisini test et
        run: python scripts/check_turkish_surface.py --self-test
      - name: Türkçe yüzeyi denetle
        run: python scripts/check_turkish_surface.py
      - name: Plugin paketini doğrula
        run: python scripts/build_plugin.py --check
      - name: Plugin paketini oluştur
        run: python scripts/build_plugin.py
      - name: Workflow artifact'ını yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: no-ai-slop-turkish-plugin
          path: dist/no-ai-slop-turkish-plugin-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Doğrulanmış plugini indir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: no-ai-slop-turkish-plugin
          path: dist
      - name: Paketi GitHub release'a ekle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/no-ai-slop-turkish-plugin-*.zip --generate-notes --verify-tag
